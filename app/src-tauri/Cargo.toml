[package]
name = "fm27-analyst"
version = "0.3.0"
description = "FM27 Real-Time Analyst — AI-помощник главного тренера для Football Manager 27"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
