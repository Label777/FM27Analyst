[project]
name = "fm27-analyst-core"
version = "0.1.0"
description = "Аналитическое ядро FM27 Real-Time Analyst: состояние матча, правила, AI-советы, API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pillow>=10.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
windows = [
    "windows-capture>=1.4; sys_platform == 'win32'",
    "mss>=9.0",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
fm27-core = "fm27_analyst.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fm27_analyst*"]

[tool.setuptools.package-data]
fm27_analyst = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
